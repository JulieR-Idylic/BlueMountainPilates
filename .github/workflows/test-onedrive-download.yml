name: Test OneDrive Download

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest

    steps:
      - name: Test OneDrive response
        run: |
          curl -L \
            --show-error \
            --silent \
            --output /tmp/onedrive-response \
            --write-out "HTTP_STATUS=%{http_code}\nCONTENT_TYPE=%{content_type}\n" \
            "${{ secrets.ONEDRIVE_SCHEDULE_URL }}&download=1"

          echo
          echo "Downloaded response:"
          ls -lh /tmp/onedrive-response

          echo
          echo "Detected file type:"
          file /tmp/onedrive-response
