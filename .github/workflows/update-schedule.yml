name: Update Live Schedule

on:
  workflow_dispatch:

  schedule:
    - cron: "30-59/10 4 * * *"
      timezone: "America/Los_Angeles"

    - cron: "*/10 5-21 * * *"
      timezone: "America/Los_Angeles"

    - cron: "0 22 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v6

      - name: Set up Python
        id: python_setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        id: dependencies
        shell: bash
        run: |
          if ! python -m pip install --upgrade pip; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=PYTHON_SETUP" >> "$GITHUB_ENV"
            echo "::error::LEVEL 1 PIPELINE FAILURE [PYTHON_SETUP]: Unable to upgrade pip."
            exit 1
          fi

          if ! pip install openpyxl; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=PYTHON_SETUP" >> "$GITHUB_ENV"
            echo "::error::LEVEL 1 PIPELINE FAILURE [PYTHON_SETUP]: Unable to install openpyxl."
            exit 1
          fi

      - name: Get Microsoft Graph access token
        id: graph_auth
        shell: bash
        run: |
          if ! RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/consumers/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${{ secrets.MS_GRAPH_CLIENT_ID }}" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=${{ secrets.MS_GRAPH_REFRESH_TOKEN }}" \
            --data-urlencode "scope=Files.Read User.Read offline_access"); then

            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=GRAPH_AUTH_UNREACHABLE" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [GRAPH_AUTH_UNREACHABLE]: Unable to reach Microsoft authentication service."
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "
          import sys, json

          try:
              data = json.load(sys.stdin)
          except Exception:
              print('')
              sys.exit(0)

          print(data.get('access_token', ''))
          ")

          if [ -z "$ACCESS_TOKEN" ]; then
            ERROR_CODE=$(echo "$RESPONSE" | python3 -c "
          import sys, json

          try:
              data = json.load(sys.stdin)
              print(data.get('error', 'unknown'))
          except Exception:
              print('invalid_response')
          ")

            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=GRAPH_AUTH" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [GRAPH_AUTH]: Microsoft Graph authentication failed: $ERROR_CODE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          echo "SUCCESS: Microsoft Graph authentication completed."

      - name: Check OneDrive workbook modified time
        id: source_check
        shell: bash
        run: |
          if ! HTTP_STATUS=$(curl -sS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -o item-metadata.json \
            -w "%{http_code}" \
            "https://graph.microsoft.com/v1.0/me/drive/items/${{ secrets.ONEDRIVE_SCHEDULE_ITEM_ID }}?\$select=id,name,lastModifiedDateTime"); then

            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=ONEDRIVE_UNREACHABLE" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [ONEDRIVE_UNREACHABLE]: Unable to reach Microsoft Graph for workbook metadata."
            exit 1
          fi

          echo "Metadata HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "404" ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=WORKBOOK_NOT_FOUND" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [WORKBOOK_NOT_FOUND]: The OneDrive schedule workbook item could not be found."
            exit 1
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=WORKBOOK_METADATA" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [WORKBOOK_METADATA]: Unable to retrieve schedule workbook metadata. HTTP $HTTP_STATUS."
            exit 1
          fi

          set +e

          SOURCE_LAST_MODIFIED=$(python3 - <<'PY'
          import json
          import sys

          try:
              with open(
                  "item-metadata.json",
                  "r",
                  encoding="utf-8",
              ) as file:
                  data = json.load(file)

              value = data.get("lastModifiedDateTime")

              if not value:
                  raise ValueError(
                      "lastModifiedDateTime was not returned"
                  )

              print(value)

          except Exception as error:
              print(
                  f"Metadata parse failure: {error}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
          )

          RESULT=$?

          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=INVALID_METADATA" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [INVALID_METADATA]: Graph returned unusable workbook metadata."
            exit 1
          fi

          STORED_LAST_MODIFIED=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "schedule/data/schedule.json"
          )

          if (
              not path.exists()
              or path.stat().st_size == 0
          ):
              print("")
              raise SystemExit(0)

          try:
              with path.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  data = json.load(file)

          except (
              json.JSONDecodeError,
              OSError,
          ):
              print("")
              raise SystemExit(0)

          print(
              data.get(
                  "sourceLastModified",
                  ""
              )
          )
          PY
          )

          echo "OneDrive last modified: $SOURCE_LAST_MODIFIED"

          if [ -n "$STORED_LAST_MODIFIED" ]; then
            echo "Last processed:         $STORED_LAST_MODIFIED"
          else
            echo "Last processed:         not yet recorded"
          fi

          echo "source_last_modified=$SOURCE_LAST_MODIFIED" >> "$GITHUB_OUTPUT"

          if [ "$SOURCE_LAST_MODIFIED" = "$STORED_LAST_MODIFIED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo
            echo "INFO [NO_CHANGE]: Workbook timestamp is unchanged."
            echo "No download or extraction is necessary."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo
            echo "INFO [SOURCE_CHANGED]: Workbook has changed since the last processed version."
            echo "Continuing to download and inspect the public schedule."
          fi

      - name: Download exact schedule workbook
        id: workbook_download
        if: steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          if ! HTTP_STATUS=$(curl -sS -L \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -o Studio_schedule2026.xlsx \
            -w "%{http_code}" \
            "https://graph.microsoft.com/v1.0/me/drive/items/${{ secrets.ONEDRIVE_SCHEDULE_ITEM_ID }}/content"); then

            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=WORKBOOK_DOWNLOAD" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [WORKBOOK_DOWNLOAD]: Unable to download the OneDrive schedule workbook."
            exit 1
          fi

          echo "Download HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "404" ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=WORKBOOK_NOT_FOUND" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [WORKBOOK_NOT_FOUND]: The schedule workbook disappeared before it could be downloaded."
            exit 1
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=WORKBOOK_DOWNLOAD" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [WORKBOOK_DOWNLOAD]: Workbook download failed. HTTP $HTTP_STATUS."
            exit 1
          fi

          echo "Downloaded file:"
          ls -lh Studio_schedule2026.xlsx

          echo "Detected file type:"
          file Studio_schedule2026.xlsx

          set +e

          python3 - <<'PY'
          import zipfile
          import sys

          filename = "Studio_schedule2026.xlsx"

          if not zipfile.is_zipfile(filename):
              print(
                  "Downloaded file is not a valid XLSX/ZIP container.",
                  file=sys.stderr,
              )
              sys.exit(1)

          with zipfile.ZipFile(filename) as z:
              names = set(z.namelist())

          required = {
              "[Content_Types].xml",
              "xl/workbook.xml",
          }

          missing = required - names

          if missing:
              print(
                  "XLSX structure is incomplete: "
                  + ", ".join(sorted(missing)),
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              "SUCCESS: Downloaded workbook passed XLSX validation."
          )
          PY

          RESULT=$?

          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=INVALID_WORKBOOK" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [INVALID_WORKBOOK]: The downloaded file is not a usable XLSX workbook."
            exit 1
          fi

      - name: Generate and validate public schedule JSON
        id: extractor
        if: steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set +e

          python schedule/scripts/extract_schedule.py Studio_schedule2026.xlsx

          RESULT=$?

          set -e

          if [ "$RESULT" -eq 2 ]; then
            echo "PIPELINE_ERROR_LEVEL=2" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=SCHEDULE_ANOMALY" >> "$GITHUB_ENV"

            echo
            echo "LEVEL 2 anomaly was reported by the schedule extractor."
            echo "Publication has been stopped."
            exit 2
          fi

          if [ "$RESULT" -ne 0 ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=EXTRACTOR_FAILURE" >> "$GITHUB_ENV"

            echo
            echo "::error::LEVEL 1 PIPELINE FAILURE [EXTRACTOR_FAILURE]: Schedule extraction failed."
            exit 1
          fi

      - name: Add source modified time to schedule JSON
        id: timestamp
        if: steps.source_check.outputs.changed == 'true'
        env:
          SOURCE_LAST_MODIFIED: ${{ steps.source_check.outputs.source_last_modified }}
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(
              "schedule/data/schedule.json"
          )

          try:
              with path.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  data = json.load(file)

              data["sourceLastModified"] = (
                  os.environ[
                      "SOURCE_LAST_MODIFIED"
                  ]
              )

              with path.open(
                  "w",
                  encoding="utf-8",
              ) as file:
                  json.dump(
                      data,
                      file,
                      indent=2,
                      ensure_ascii=False,
                  )

                  file.write("\n")

              print(
                  "INFO [TIMESTAMP_RECORDED]:",
                  data["sourceLastModified"],
              )

          except Exception as error:
              print(
                  f"Unable to update schedule metadata: {error}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

          RESULT=$?

          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=JSON_METADATA" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [JSON_METADATA]: Unable to record the processed workbook timestamp."
            exit 1
          fi

      - name: Inspect generated schedule JSON
        id: json_validation
        if: steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          import json
          import sys

          try:
              with open(
                  "schedule/data/schedule.json",
                  "r",
                  encoding="utf-8",
              ) as file:
                  data = json.load(file)

              if data.get("schemaVersion") != 2:
                  raise ValueError(
                      "Unexpected schemaVersion"
                  )

              if not isinstance(
                  data.get("weeks"),
                  list,
              ):
                  raise ValueError(
                      "weeks is not a list"
                  )

              if not data.get(
                  "sourceLastModified"
              ):
                  raise ValueError(
                      "sourceLastModified is missing"
                  )

              print(
                  "Schema version:",
                  data["schemaVersion"],
              )

              print(
                  "Source last modified:",
                  data["sourceLastModified"],
              )

              print(
                  "Weeks:",
                  len(data["weeks"]),
              )

              for week in data["weeks"]:
                  print(
                      week["key"],
                      "->",
                      week["sourceSheet"]
                      + "!"
                      + week["sourceRange"],
                      "|",
                      week["rowCount"],
                      "rows x",
                      week["columnCount"],
                      "columns",
                  )

          except Exception as error:
              print(
                  f"Generated JSON validation failed: {error}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

          RESULT=$?

          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=INVALID_JSON" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [INVALID_JSON]: Generated schedule JSON failed final validation."
            exit 1
          fi

      - name: Determine whether public schedule changed
        id: schedule_check
        if: steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          set +e

          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          try:
              current_path = Path(
                  "schedule/data/schedule.json"
              )

              with current_path.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  new_data = json.load(file)

              try:
                  old_json = subprocess.check_output(
                      [
                          "git",
                          "show",
                          "HEAD:schedule/data/schedule.json",
                      ],
                      text=True,
                  )

                  old_data = json.loads(
                      old_json
                  )

              except (
                  subprocess.CalledProcessError,
                  json.JSONDecodeError,
              ):
                  old_data = {}

              public_changed = (
                  old_data.get(
                      "schemaVersion"
                  )
                  != new_data.get(
                      "schemaVersion"
                  )
                  or
                  old_data.get("weeks")
                  != new_data.get("weeks")
              )

              with open(
                  "schedule-change.txt",
                  "w",
                  encoding="utf-8",
              ) as file:
                  file.write(
                      "true"
                      if public_changed
                      else "false"
                  )

              if public_changed:
                  print(
                      "INFO [PUBLIC_CHANGED]: "
                      "Public schedule content changed."
                  )
              else:
                  print(
                      "INFO [PUBLIC_UNCHANGED]: "
                      "Workbook changed, but public "
                      "schedule content did not."
                  )

          except Exception as error:
              print(
                  f"Schedule comparison failed: {error}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

          RESULT=$?

          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=SCHEDULE_COMPARE" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [SCHEDULE_COMPARE]: Unable to compare the new schedule with the currently published schedule."
            exit 1
          fi

          PUBLIC_CHANGED=$(cat schedule-change.txt)

          echo "public_changed=$PUBLIC_CHANGED" >> "$GITHUB_OUTPUT"

            - name: Add published time when schedule changed
        if: steps.source_check.outputs.changed == 'true' && steps.schedule_check.outputs.public_changed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("schedule/data/schedule.json")

          with path.open(
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          data["publishedAt"] = (
              datetime.now(timezone.utc).isoformat()
          )

          with path.open(
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  data,
                  file,
                  indent=2,
                  ensure_ascii=False,
              )

              file.write("\n")

          print(
              "INFO [PUBLISHED_AT]:",
              data["publishedAt"],
          )
          PY

      - name: Commit processed schedule state
        id: publish
        if: steps.source_check.outputs.changed == 'true'
        shell: bash
        run: |
          PUBLIC_CHANGED="${{ steps.schedule_check.outputs.public_changed }}"

          if [ "$PUBLIC_CHANGED" = "true" ]; then
            echo "INFO [PUBLISH]: Public schedule changed."
            echo "Updating schedule content and source timestamp."
          else
            echo "INFO [STATE_UPDATE]: Public schedule did not change."
            echo "Updating processed source timestamp only."
          fi

          if git diff --quiet -- schedule/data/schedule.json; then
            echo
            echo "INFO [NO_REPO_CHANGE]: No repository update is necessary."
            exit 0
          fi

          git config user.name "Blue Mountain Pilates Schedule Bot"
          git config user.email "actions@github.com"

          git add schedule/data/schedule.json

          if [ "$PUBLIC_CHANGED" = "true" ]; then
            if ! git commit -m "Update live schedule"; then
              echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
              echo "PIPELINE_ERROR_CODE=GIT_COMMIT" >> "$GITHUB_ENV"

              echo "::error::LEVEL 1 PIPELINE FAILURE [GIT_COMMIT]: Unable to commit the updated live schedule."
              exit 1
            fi
          else
            if ! git commit -m "Record processed schedule workbook"; then
              echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
              echo "PIPELINE_ERROR_CODE=GIT_COMMIT" >> "$GITHUB_ENV"

              echo "::error::LEVEL 1 PIPELINE FAILURE [GIT_COMMIT]: Unable to commit the processed workbook state."
              exit 1
            fi
          fi

          if ! git push; then
            echo "PIPELINE_ERROR_LEVEL=1" >> "$GITHUB_ENV"
            echo "PIPELINE_ERROR_CODE=GIT_PUSH" >> "$GITHUB_ENV"

            echo "::error::LEVEL 1 PIPELINE FAILURE [GIT_PUSH]: The schedule was processed successfully, but GitHub could not publish the repository update."
            exit 1
          fi

          echo
          echo "SUCCESS: Processed workbook state was committed to the repository."

      # -----------------------------------------------------
      # PIPELINE INCIDENT STATE
      #
      # This section always runs, even when an earlier
      # pipeline step failed.
      # -----------------------------------------------------

      - name: Determine pipeline health outcome
        id: health
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_SETUP_OUTCOME: ${{ steps.python_setup.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          GRAPH_AUTH_OUTCOME: ${{ steps.graph_auth.outcome }}
          SOURCE_CHECK_OUTCOME: ${{ steps.source_check.outcome }}
          WORKBOOK_DOWNLOAD_OUTCOME: ${{ steps.workbook_download.outcome }}
          EXTRACTOR_OUTCOME: ${{ steps.extractor.outcome }}
          TIMESTAMP_OUTCOME: ${{ steps.timestamp.outcome }}
          JSON_VALIDATION_OUTCOME: ${{ steps.json_validation.outcome }}
          SCHEDULE_CHECK_OUTCOME: ${{ steps.schedule_check.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          ERROR_LEVEL="${PIPELINE_ERROR_LEVEL:-}"
          ERROR_CODE="${PIPELINE_ERROR_CODE:-}"

          if [ -z "$ERROR_LEVEL" ]; then

            if [ "$CHECKOUT_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="GIT_CHECKOUT"

            elif [ "$PYTHON_SETUP_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="PYTHON_SETUP"

            elif [ "$DEPENDENCIES_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="PYTHON_SETUP"

            elif [ "$GRAPH_AUTH_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="GRAPH_AUTH"

            elif [ "$SOURCE_CHECK_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="WORKBOOK_METADATA"

            elif [ "$WORKBOOK_DOWNLOAD_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="WORKBOOK_DOWNLOAD"

            elif [ "$EXTRACTOR_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="EXTRACTOR_FAILURE"

            elif [ "$TIMESTAMP_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="JSON_METADATA"

            elif [ "$JSON_VALIDATION_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="INVALID_JSON"

            elif [ "$SCHEDULE_CHECK_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="SCHEDULE_COMPARE"

            elif [ "$PUBLISH_OUTCOME" = "failure" ]; then
              ERROR_LEVEL="1"
              ERROR_CODE="GIT_PUSH"

            fi
          fi

          if [ -n "$ERROR_LEVEL" ]; then
            echo "pipeline_status=failed" >> "$GITHUB_OUTPUT"
            echo "error_level=$ERROR_LEVEL" >> "$GITHUB_OUTPUT"
            echo "error_code=$ERROR_CODE" >> "$GITHUB_OUTPUT"

            echo
            echo "Pipeline result: FAILED"
            echo "Level: $ERROR_LEVEL"
            echo "Code: $ERROR_CODE"

          else
            echo "pipeline_status=healthy" >> "$GITHUB_OUTPUT"
            echo "error_level=" >> "$GITHUB_OUTPUT"
            echo "error_code=" >> "$GITHUB_OUTPUT"

            echo
            echo "Pipeline result: HEALTHY"
          fi

      - name: Update pipeline incident state
        id: incident_state
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.health.outputs.pipeline_status }}" = "failed" ]; then

            python schedule/scripts/update_pipeline_state.py \
              --state failed \
              --level "${{ steps.health.outputs.error_level }}" \
              --code "${{ steps.health.outputs.error_code }}"

          else

            python schedule/scripts/update_pipeline_state.py \
              --state healthy

          fi

      - name: Commit pipeline incident state
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet -- schedule/data/pipeline-state.json; then
            echo "INFO [PIPELINE_STATE_UNCHANGED]: No incident-state repository update is necessary."
            exit 0
          fi

          git config user.name "Blue Mountain Pilates Schedule Bot"
          git config user.email "actions@github.com"

          git add schedule/data/pipeline-state.json

          git commit -m "Update schedule pipeline health"

          if ! git push; then
            echo "::warning::Pipeline state changed, but the health-state commit could not be pushed."
            exit 1
          fi

          echo "SUCCESS: Pipeline incident state was updated."